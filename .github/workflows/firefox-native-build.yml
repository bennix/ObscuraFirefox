name: Firefox native source builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - name: Free Linux build space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv clang libgtk-3-dev libdbus-glib-1-dev libasound2-dev libx11-xcb-dev libxt-dev libpulse-dev nasm yasm
      - name: Install MozillaBuild
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-4.2.exe -OutFile "$env:RUNNER_TEMP\MozillaBuild.exe"
          $process = Start-Process "$env:RUNNER_TEMP\MozillaBuild.exe" -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'MozillaBuild installation failed' }
      - name: Fetch pinned Firefox source
        shell: bash
        run: |
          git init firefox-source
          git -C firefox-source remote add origin https://github.com/mozilla-firefox/firefox.git
          git -C firefox-source fetch --depth=1 origin dc1259aee26fc94e00047ad4da433ceac1583eb4
          git -C firefox-source checkout --detach FETCH_HEAD
          npm ci --prefix desktop
          node desktop/prepare-assets.cjs
          node desktop/firefox/apply-source.cjs firefox-source
          cat >> firefox-source/mozconfig <<'CONFIG'
          mk_add_options MOZ_MAKE_FLAGS="-j2"
          ac_add_options --disable-debug-symbols
          ac_add_options --disable-tests
          CONFIG
      - name: Build Linux from source
        if: runner.os == 'Linux'
        working-directory: firefox-source
        env:
          MOZBUILD_STATE_PATH: ${{ runner.temp }}/mozbuild
          MOZ_NOSPAM: '1'
        run: |
          ./mach --no-interactive bootstrap --application-choice browser
          ./mach build
          ./mach package
      - name: Build Intel macOS from source
        if: runner.os == 'macOS'
        working-directory: firefox-source
        env:
          MOZBUILD_STATE_PATH: ${{ runner.temp }}/mozbuild
          MOZ_NOSPAM: '1'
        run: |
          ./mach --no-interactive bootstrap --application-choice browser
          ./mach build
          ./mach package
          ditto -c -k --sequesterRsrc --keepParent ../obj-obscura/dist/firefox/Obscura.app ../obj-obscura/dist/firefox-macos-x64.zip
      - name: Build Windows from source
        if: runner.os == 'Windows'
        shell: C:\mozilla-build\msys2\usr\bin\bash.exe -l -e {0}
        env:
          MOZILLABUILD: C:\mozilla-build
          MOZ_NOSPAM: '1'
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")/firefox-source"
          export PATH="/c/mozilla-build/bin:/c/mozilla-build/msys2/usr/bin:$PATH"
          ./mach --no-interactive bootstrap --application-choice browser
          ./mach build
          ./mach package
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-engine-${{ runner.os }}-x64
          path: |
            obj-obscura/dist/*.tar.xz
            obj-obscura/dist/*.tar.bz2
            obj-obscura/dist/*.zip
          if-no-files-found: error
          retention-days: 14
