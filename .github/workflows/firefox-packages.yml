name: Firefox desktop installers
on:
  workflow_run:
    workflows: [Firefox native source builds]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful Firefox native source build run ID
        required: true
      platform:
        description: Platform to package
        type: choice
        options: [all, linux, windows]
        default: all
permissions:
  contents: read
  actions: read
jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'linux' && '["ubuntu-24.04"]' || inputs.platform == 'windows' && '["windows-2022"]' || '["ubuntu-24.04", "windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: firefox-engine-${{ runner.os }}-x64
          path: engine
          run-id: ${{ inputs.source_run || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Stage native runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OBSCURA_ENGINE_RUN: ${{ inputs.source_run || github.event.workflow_run.id }}
        run: |
          npm ci --prefix desktop
          node desktop/prepare-assets.cjs
          python desktop/firefox/package-portable.py engine desktop/dist/portable
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile Windows launchers
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          rc /fo icon.res desktop\firefox\windows-launcher.rc
          if errorlevel 1 exit /b 1
          cl /O2 /W4 desktop\firefox\windows-launcher.c /Fe:desktop\dist\portable\Obscura.exe /link icon.res /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup
          if errorlevel 1 exit /b 1
          cl /O2 /W4 /DNATIVE_HOST desktop\firefox\windows-launcher.c /Fe:desktop\dist\portable\obscura-desktop\bin\obscura-native-host.exe
          if errorlevel 1 exit /b 1
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 libgtk-3-0t64 libasound2t64 libdbus-glib-1-2 libsecret-tools rpm ruby-dev
      - name: Verify native Linux browser and media
        if: runner.os == 'Linux'
        run: |
          mv desktop/dist/portable 'desktop/dist/Obscura 浏览器'
          export OBSCURA_FIREFOX_BIN="$PWD/desktop/dist/Obscura 浏览器/firefox"
          export OBSCURA_TEST_BACKEND="$PWD/desktop/dist/Obscura 浏览器/obscura-desktop"
          python - <<'PY'
          import os, pathlib
          binary = os.environ['OBSCURA_FIREFOX_BIN']
          pathlib.Path('/tmp/obscura-ci-apparmor').write_text('abi <abi/4.0>,\nprofile obscura-ci "' + binary + '{,-bin}" flags=(unconfined) {\n  userns,\n}\n')
          PY
          sudo apparmor_parser -r /tmp/obscura-ci-apparmor
          dbus-run-session -- xvfb-run -a node --test desktop/test/firefox-runtime.test.cjs
          "$OBSCURA_TEST_BACKEND/runtime/media/yt-dlp/yt-dlp_linux" --version
          mv 'desktop/dist/Obscura 浏览器' desktop/dist/portable
      - name: Verify native Windows browser and media
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: pwsh
        run: |
          Move-Item desktop/dist/portable 'desktop/dist/Obscura 浏览器'
          $env:OBSCURA_FIREFOX_BIN="$env:GITHUB_WORKSPACE\desktop\dist\Obscura 浏览器\firefox.exe"
          $env:OBSCURA_TEST_BACKEND="$env:GITHUB_WORKSPACE\desktop\dist\Obscura 浏览器\obscura-desktop"
          node --test desktop/test/firefox-runtime.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows browser tests failed' }
          & "$env:OBSCURA_TEST_BACKEND/runtime/media/yt-dlp/yt-dlp.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'yt-dlp verification failed' }
          Move-Item 'desktop/dist/Obscura 浏览器' desktop/dist/portable
      - name: Build DEB and RPM
        if: runner.os == 'Linux'
        run: |
          sudo gem install fpm --no-document
          mkdir -p packaging-root/opt packaging-root/etc/apparmor.d packaging-root/usr/bin packaging-root/usr/share/applications packaging-root/usr/share/icons/hicolor/256x256/apps desktop/release
          cp desktop/firefox/linux-apparmor packaging-root/etc/apparmor.d/obscura-firefox
          cp -a desktop/dist/portable packaging-root/opt/obscura-firefox
          ln -s /opt/obscura-firefox/obscura packaging-root/usr/bin/obscura-firefox
          cp desktop/firefox/branding/generated/default256.png packaging-root/usr/share/icons/hicolor/256x256/apps/obscura-firefox.png
          cat > packaging-root/usr/share/applications/obscura-firefox.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Obscura Firefox
          Exec=/opt/obscura-firefox/obscura
          Icon=obscura-firefox
          Categories=Network;WebBrowser;
          Terminal=false
          DESKTOP
          fpm --after-install desktop/firefox/linux-postinstall.sh -s dir -t deb -n obscura-firefox -v 0.3.4 --architecture amd64 --license MPL-2.0 --description 'Firefox browser with local AI and media workspace' --url https://github.com/bennix/ObscuraFirefox --maintainer 'Obscura Firefox contributors' -d 'libgtk-3-0 | libgtk-3-0t64' -d libdbus-glib-1-2 -d libsecret-tools -d gnome-keyring -C packaging-root -p desktop/release/ObscuraFirefox-0.3.4-linux-amd64.deb .
          fpm --after-install desktop/firefox/linux-postinstall.sh -s dir -t rpm -n obscura-firefox -v 0.3.4 --architecture x86_64 --license MPL-2.0 --description 'Firefox browser with local AI and media workspace' --url https://github.com/bennix/ObscuraFirefox --maintainer 'Obscura Firefox contributors' -d gtk3 -d dbus-glib -d libsecret -d gnome-keyring -C packaging-root -p desktop/release/ObscuraFirefox-0.3.4-linux-x86_64.rpm .
          dpkg-deb --info desktop/release/*.deb
          rpm -qip desktop/release/*.rpm
      - name: Install and verify Linux package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./desktop/release/ObscuraFirefox-0.3.4-linux-amd64.deb
          export OBSCURA_FIREFOX_BIN=/opt/obscura-firefox/firefox
          export OBSCURA_TEST_BACKEND=/opt/obscura-firefox/obscura-desktop
          dbus-run-session -- xvfb-run -a node --test desktop/test/firefox-runtime.test.cjs
          mkdir -p /tmp/obscura-rpm-check
          rpm2cpio desktop/release/ObscuraFirefox-0.3.4-linux-x86_64.rpm | (cd /tmp/obscura-rpm-check && cpio --quiet -id)
          cmp /opt/obscura-firefox/firefox /tmp/obscura-rpm-check/opt/obscura-firefox/firefox
          cmp /opt/obscura-firefox/obscura-desktop/runtime/media/ffmpeg /tmp/obscura-rpm-check/opt/obscura-firefox/obscura-desktop/runtime/media/ffmpeg
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' desktop/firefox/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}-x64
          path: |
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
