<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obscura</title>
<style>
:root { color-scheme: light dark; font-family: system-ui, sans-serif; }
body { max-width: 680px; margin: 10vh auto; padding: 24px; }
h1 { font-size: 26px; }
p { overflow-wrap: anywhere; }
label { display: block; margin: 24px 0 8px; }
select { width: 100%; padding: 12px; font: inherit; }
.actions { display: flex; gap: 12px; margin-top: 24px; }
button { padding: 10px 20px; font: inherit; cursor: pointer; }
#download { background: #065ee6; color: white; border: 1px solid #065ee6; border-radius: 6px; }
#status { min-height: 1.5em; }
</style>
</head>
<body>
<h1 id="heading"></h1>
<p id="title"></p>
<form id="download-form">
<label id="quality-label" for="quality"></label>
<select id="quality" disabled></select>
<p id="status" role="status" aria-live="polite"></p>
<div class="actions">
<button id="download" type="submit" disabled></button>
<button id="retry" type="button" hidden></button>
<button id="cancel" type="button"></button>
</div>
</form>
<script src="download-options.js"></script>
</body>
</html>
