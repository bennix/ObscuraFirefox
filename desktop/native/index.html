<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src 'self'; connect-src http://127.0.0.1:*; object-src 'none'">
<title>Obscura Desktop</title><link rel="stylesheet" href="window.css"></head>
<body><header><div class="brand">◒ <span>OBSCURA</span></div><div id="tabs" role="tablist"></div><button id="new-tab" title="新建标签页">＋</button><button id="toggle-panel">AI 工作台</button><button id="open-reading">翻译 / 词典</button><button id="open-downloads">下载</button><button id="theme-toggle" title="切换暗色 / 亮色主题">☀</button><button id="open-settings">设置</button></header>
<form id="address-bar"><button type="button" id="back" title="后退">←</button><button type="button" id="forward" title="前进">→</button><button type="button" id="reload" title="刷新">↻</button><input id="address" aria-label="网页地址" spellcheck="false" placeholder="搜索或输入网址"><button type="button" id="bookmark-toggle" title="收藏此页（⌘D）">☆</button><button type="submit" id="go">前往 ↗</button></form>
<nav id="bookmarks" aria-label="收藏栏"><div id="bookmark-list"></div><button type="button" id="bookmark-import" title="导入 Chrome、Safari、Firefox 导出的书签 HTML">导入</button><button type="button" id="bookmark-export" title="导出为通用书签 HTML">导出</button><input id="bookmark-file" type="file" accept=".html,.htm" hidden></nav>
<div id="error" role="alert" hidden></div><main><div id="pages"></div><aside id="panel-container"><iframe id="workbench" nwdisable title="Obscura 工作台"></iframe></aside></main>
<div id="selection-box" hidden><span id="selection-word"></span><button id="search-selection">搜索 ↗</button><button id="lookup-selection">AI 查词</button><button id="dismiss-selection" aria-label="关闭划词">×</button></div><footer><span id="page-status">正在启动…</span><span id="runtime">Obscura Desktop</span></footer><script src="window.js"></script></body></html>
